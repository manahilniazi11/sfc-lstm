[project]
name = "sonic"
version = "0.1.0"
description = "SonicSentinel AI acoustic event detection and monitoring prototype"
readme = "README.md"
authors = [
    { name = "Saeed Ahmed" },
    { name = "Manahil Khan" },
    { name = "Muhammad Kaif" },
    { name = "Sahil Karim Lakahni" },
]
requires-python = ">=3.11.9"
dependencies = [
    "django>=5.2.17",
    "edge-tts>=7.2.8",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "noisereduce>=3.0.3",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "tensorflow>=2.21.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "sonic.web.settings"
