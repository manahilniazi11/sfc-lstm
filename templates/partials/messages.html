{% if messages %}
<div class="messages">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} flex items-start gap-2" role="alert">
    <span class="grow">{{ message }}</span>
    <button type="button" class="btn-close" data-dismiss=".alert" aria-label="Close"><i class="bi bi-x-lg text-sm"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
