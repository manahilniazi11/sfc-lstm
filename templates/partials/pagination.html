{% if page.has_other_pages %}
<nav aria-label="Pages">
  <ul class="pagination">
    {% if page.has_previous %}<li><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a></li>{% endif %}
    <li><span class="page-link disabled">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
